<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="520">
  <defs>
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F1C"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3A"/>
      <stop offset="100%" stop-color="#152130"/>
    </linearGradient>

    <filter id="demoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      @keyframes nodeGlow {
        0%, 100% { filter: drop-shadow(0 0 4px #00D4FF); }
        50% { filter: drop-shadow(0 0 10px #00D4FF); }
      }
      @keyframes edgeFlow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes chartLineDraw {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .p-dot { transform-origin: center; animation: pulseDot 2s infinite ease-in-out; }
      .n-glow { animation: nodeGlow 3s infinite ease-in-out; }
      .e-flow { stroke-dasharray: 4, 4; animation: edgeFlow 1.5s infinite linear; }
      .chart-path { stroke-dasharray: 400; animation: chartLineDraw 3s ease-out forwards; }

      .txt-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .txt-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="520" rx="14" fill="url(#demoBg)" stroke="#2A3A4E" stroke-width="1.5"/>

  <!-- Top App Window Bar -->
  <rect width="900" height="42" rx="14" fill="#070F1C"/>
  <rect y="28" width="900" height="14" fill="#070F1C"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1E2A3A" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="40" cy="21" r="5" fill="#FFD700" opacity="0.8"/>
  <circle cx="56" cy="21" r="5" fill="#00FFB3" opacity="0.8"/>

  <!-- Window Title -->
  <text x="450" y="26" fill="#8899AA" class="txt-main" font-size="12" font-weight="600" text-anchor="middle">
    FirstNode v2.0 &bull; Digital Identity Journey Dashboard
  </text>

  <!-- Autopilot Status Pill in Window Bar -->
  <g transform="translate(740, 10)">
    <rect width="136" height="22" rx="11" fill="#0A1628" stroke="#00FFB3" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#00FFB3" class="p-dot"/>
    <text x="22" y="15" fill="#00FFB3" class="txt-main" font-size="9.5" font-weight="700" letter-spacing="0.5">AUTOPILOT ON</text>
  </g>

  <!-- 4 Grid View Panels -->

  <!-- Panel 1: Timeline View (Top-Left) -->
  <g transform="translate(24, 60)">
    <rect width="414" height="210" rx="10" fill="url(#cardGrad)" stroke="#2A3A4E" stroke-width="1"/>
    
    <!-- Header -->
    <text x="16" y="26" fill="#FFFFFF" class="txt-main" font-size="13" font-weight="700">Timeline &bull; Recent Submissions</text>
    <rect x="300" y="12" width="98" height="20" rx="4" fill="#0A1628" stroke="#2A3A4E"/>
    <text x="349" y="26" fill="#00D4FF" class="txt-main" font-size="10" font-weight="600" text-anchor="middle">Newest First</text>

    <!-- Sub-Tabs for Category Filtering -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="34" height="18" rx="4" fill="#00D4FF"/>
      <text x="17" y="13" fill="#0A1628" class="txt-main" font-size="9.5" font-weight="700" text-anchor="middle">All</text>

      <rect x="40" y="0" width="56" height="18" rx="4" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.4"/>
      <text x="68" y="13" fill="#00D4FF" class="txt-main" font-size="9.5" font-weight="600" text-anchor="middle">Identity</text>

      <rect x="102" y="0" width="50" height="18" rx="4" fill="#0A1628" stroke="#FFD700" stroke-opacity="0.4"/>
      <text x="127" y="13" fill="#FFD700" class="txt-main" font-size="9.5" font-weight="600" text-anchor="middle">OAuth</text>

      <rect x="158" y="0" width="56" height="18" rx="4" fill="#0A1628" stroke="#FF6B6B" stroke-opacity="0.4"/>
      <text x="186" y="13" fill="#FF6B6B" class="txt-main" font-size="9.5" font-weight="600" text-anchor="middle">Contact</text>

      <rect x="220" y="0" width="60" height="18" rx="4" fill="#0A1628" stroke="#9B59B6" stroke-opacity="0.4"/>
      <text x="250" y="13" fill="#9B59B6" class="txt-main" font-size="9.5" font-weight="600" text-anchor="middle">Financial</text>
    </g>

    <!-- Card 1: twitter.com -->
    <g transform="translate(16, 68)">
      <rect width="382" height="60" rx="8" fill="#0A1628" stroke="#2A3A4E"/>
      <circle cx="20" cy="20" r="8" fill="#1E2A3A"/>
      <text x="36" y="23" fill="#FFFFFF" class="txt-main" font-size="12" font-weight="600">twitter.com</text>
      <text x="366" y="23" fill="#8899AA" class="txt-main" font-size="10" text-anchor="end">2 mins ago</text>

      <rect x="36" y="34" width="58" height="16" rx="3" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.3)"/>
      <text x="65" y="46" fill="#00D4FF" class="txt-main" font-size="8.5" font-weight="700" text-anchor="middle">IDENTITY</text>

      <rect x="100" y="34" width="56" height="16" rx="3" fill="rgba(255,107,107,0.12)" stroke="rgba(255,107,107,0.3)"/>
      <text x="128" y="46" fill="#FF6B6B" class="txt-main" font-size="8.5" font-weight="700" text-anchor="middle">CONTACT</text>

      <text x="166" y="46" fill="#8899AA" class="txt-mono" font-size="10">email: jo***@email.com</text>
    </g>

    <!-- Card 2: google.com (OAuth) -->
    <g transform="translate(16, 136)">
      <rect width="382" height="60" rx="8" fill="#0A1628" stroke="#2A3A4E"/>
      <circle cx="20" cy="20" r="8" fill="#1E2A3A"/>
      <text x="36" y="23" fill="#FFFFFF" class="txt-main" font-size="12" font-weight="600">accounts.google.com</text>
      <text x="366" y="23" fill="#8899AA" class="txt-main" font-size="10" text-anchor="end">12 mins ago</text>

      <rect x="36" y="34" width="94" height="16" rx="3" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.3)"/>
      <text x="83" y="46" fill="#FFD700" class="txt-main" font-size="8.5" font-weight="700" text-anchor="middle">OAUTH: GOOGLE</text>

      <text x="140" y="46" fill="#8899AA" class="txt-mono" font-size="10">auth: Google Sign-In</text>
    </g>
  </g>

  <!-- Panel 2: Journey Graph View (Top-Right) -->
  <g transform="translate(462, 60)">
    <rect width="414" height="210" rx="10" fill="url(#cardGrad)" stroke="#2A3A4E" stroke-width="1"/>
    <text x="16" y="26" fill="#FFFFFF" class="txt-main" font-size="13" font-weight="700">Journey Graph &bull; Flow Network</text>
    
    <!-- Graph Canvas Simulation -->
    <g transform="translate(20, 40)">
      <!-- Edges with flow animation -->
      <line x1="60" y1="80" x2="160" y2="40" stroke="#00D4FF" stroke-width="2" class="e-flow"/>
      <line x1="160" y1="40" x2="260" y2="90" stroke="#FF6B6B" stroke-width="2" class="e-flow"/>
      <line x1="260" y1="90" x2="340" y2="40" stroke="#FFD700" stroke-width="2" class="e-flow"/>
      <line x1="160" y1="40" x2="180" y2="120" stroke="#00FFB3" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Edge Time Labels -->
      <rect x="96" y="48" width="46" height="14" rx="3" fill="#0A1628" stroke="#2A3A4E"/>
      <text x="119" y="59" fill="#8899AA" class="txt-main" font-size="8" text-anchor="middle">5m later</text>

      <rect x="200" y="54" width="48" height="14" rx="3" fill="#0A1628" stroke="#2A3A4E"/>
      <text x="224" y="65" fill="#8899AA" class="txt-main" font-size="8" text-anchor="middle">12m later</text>

      <!-- Nodes -->
      <!-- Node 1 -->
      <circle cx="60" cy="80" r="16" fill="#0A1628" stroke="#00D4FF" stroke-width="2.5" class="n-glow"/>
      <text x="60" y="84" fill="#00D4FF" class="txt-main" font-size="9" font-weight="700" text-anchor="middle">1</text>
      <text x="60" y="108" fill="#B0C4DE" class="txt-main" font-size="9.5" text-anchor="middle">google.com</text>

      <!-- Node 2 -->
      <circle cx="160" cy="40" r="20" fill="#0A1628" stroke="#00D4FF" stroke-width="2.5" class="n-glow"/>
      <text x="160" y="44" fill="#00D4FF" class="txt-main" font-size="10" font-weight="700" text-anchor="middle">2</text>
      <text x="160" y="20" fill="#B0C4DE" class="txt-main" font-size="9.5" text-anchor="middle">twitter.com</text>

      <!-- Node 3 -->
      <circle cx="260" cy="90" r="18" fill="#0A1628" stroke="#FF6B6B" stroke-width="2.5"/>
      <text x="260" y="94" fill="#FF6B6B" class="txt-main" font-size="9.5" font-weight="700" text-anchor="middle">3</text>
      <text x="260" y="120" fill="#B0C4DE" class="txt-main" font-size="9.5" text-anchor="middle">github.com</text>

      <!-- Node 4 -->
      <circle cx="340" cy="40" r="16" fill="#0A1628" stroke="#FFD700" stroke-width="2.5"/>
      <text x="340" y="44" fill="#FFD700" class="txt-main" font-size="9" font-weight="700" text-anchor="middle">4</text>
      <text x="340" y="20" fill="#B0C4DE" class="txt-main" font-size="9.5" text-anchor="middle">stripe.com</text>

      <!-- Node 5 -->
      <circle cx="180" cy="120" r="14" fill="#0A1628" stroke="#00FFB3" stroke-width="2"/>
      <text x="180" y="124" fill="#00FFB3" class="txt-main" font-size="8.5" font-weight="700" text-anchor="middle">5</text>
      <text x="180" y="146" fill="#B0C4DE" class="txt-main" font-size="9" text-anchor="middle">amazon.com</text>
    </g>
  </g>

  <!-- Panel 3: Data Map View (Bottom-Left) -->
  <g transform="translate(24, 286)">
    <rect width="414" height="210" rx="10" fill="url(#cardGrad)" stroke="#2A3A4E" stroke-width="1"/>
    <text x="16" y="26" fill="#FFFFFF" class="txt-main" font-size="13" font-weight="700">Data Map &bull; Server Geolocation</text>
    
    <!-- Map Canvas Simulation -->
    <g transform="translate(16, 40)">
      <rect width="382" height="150" rx="6" fill="#070F1C" stroke="#1E2A3A"/>
      
      <!-- Simulated World Landmass Outlines -->
      <path d="M 40 40 Q 70 20 110 30 Q 130 50 120 80 Q 90 90 60 70 Z" fill="#142236" opacity="0.6"/>
      <path d="M 170 30 Q 230 20 270 40 Q 250 80 200 80 Z" fill="#142236" opacity="0.6"/>
      <path d="M 270 70 Q 320 60 340 100 Q 300 120 270 100 Z" fill="#142236" opacity="0.6"/>

      <!-- Glowing Server Pins -->
      <!-- NYC Pin -->
      <g transform="translate(90, 48)">
        <circle cx="0" cy="0" r="5" fill="#00D4FF" class="p-dot"/>
        <circle cx="0" cy="0" r="10" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
        <text x="8" y="3" fill="#B0C4DE" class="txt-main" font-size="8.5">US East (NYC)</text>
      </g>

      <!-- London Pin -->
      <g transform="translate(200, 36)">
        <circle cx="0" cy="0" r="5" fill="#FF6B6B" class="p-dot"/>
        <circle cx="0" cy="0" r="10" fill="none" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
        <text x="8" y="3" fill="#B0C4DE" class="txt-main" font-size="8.5">EU West (London)</text>
      </g>

      <!-- Tokyo Pin -->
      <g transform="translate(320, 60)">
        <circle cx="0" cy="0" r="5" fill="#00FFB3" class="p-dot"/>
        <circle cx="0" cy="0" r="10" fill="none" stroke="#00FFB3" stroke-width="1" opacity="0.5"/>
        <text x="8" y="3" fill="#B0C4DE" class="txt-main" font-size="8.5">AP East (Tokyo)</text>
      </g>
    </g>
  </g>

  <!-- Panel 4: Analytics View (Bottom-Right) -->
  <g transform="translate(462, 286)">
    <rect width="414" height="210" rx="10" fill="url(#cardGrad)" stroke="#2A3A4E" stroke-width="1"/>
    <text x="16" y="26" fill="#FFFFFF" class="txt-main" font-size="13" font-weight="700">Analytics &bull; Exposure History</text>
    
    <!-- Mini Stats Grid -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="86" height="42" rx="6" fill="#0A1628" stroke="#1E2A3A"/>
      <text x="43" y="20" fill="#00D4FF" class="txt-main" font-size="15" font-weight="700" text-anchor="middle">47</text>
      <text x="43" y="34" fill="#8899AA" class="txt-main" font-size="8.5" text-anchor="middle">SITES</text>

      <rect x="96" y="0" width="86" height="42" rx="6" fill="#0A1628" stroke="#1E2A3A"/>
      <text x="139" y="20" fill="#00FFB3" class="txt-main" font-size="15" font-weight="700" text-anchor="middle">128</text>
      <text x="139" y="34" fill="#8899AA" class="txt-main" font-size="8.5" text-anchor="middle">FIELDS</text>

      <rect x="192" y="0" width="94" height="42" rx="6" fill="#0A1628" stroke="#1E2A3A"/>
      <text x="239" y="20" fill="#FFD700" class="txt-main" font-size="12" font-weight="700" text-anchor="middle">Google</text>
      <text x="239" y="34" fill="#8899AA" class="txt-main" font-size="8.5" text-anchor="middle">TOP OAUTH</text>

      <rect x="296" y="0" width="86" height="42" rx="6" fill="#0A1628" stroke="#1E2A3A"/>
      <text x="339" y="20" fill="#FF6B6B" class="txt-main" font-size="12" font-weight="700" text-anchor="middle">Contact</text>
      <text x="339" y="34" fill="#8899AA" class="txt-main" font-size="8.5" text-anchor="middle">TOP TYPE</text>
    </g>

    <!-- Simulated Chart Line -->
    <g transform="translate(16, 92)">
      <rect width="382" height="98" rx="6" fill="#070F1C" stroke="#1E2A3A"/>
      
      <!-- Chart Area Gradient Fill -->
      <path d="M 20 80 L 70 70 L 130 55 L 190 60 L 250 40 L 310 25 L 360 15 L 360 85 L 20 85 Z" fill="rgba(0,212,255,0.08)"/>
      
      <!-- Chart Stroke -->
      <path d="M 20 80 L 70 70 L 130 55 L 190 60 L 250 40 L 310 25 L 360 15" fill="none" stroke="#00D4FF" stroke-width="2.5" class="chart-path"/>
      
      <circle cx="360" cy="15" r="4" fill="#00D4FF" class="p-dot"/>
      <text x="350" y="32" fill="#00D4FF" class="txt-main" font-size="9" font-weight="700" text-anchor="end">47 sites (30d)</text>
    </g>
  </g>
</svg>
