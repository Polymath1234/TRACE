<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070F1C"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#142236"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FFB3" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00D4FF); }
      }
      @keyframes rippleRing {
        0% { r: 16px; opacity: 0.8; }
        100% { r: 36px; opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .node-core { transform-origin: center; animation: pulseNode 3s infinite ease-in-out; }
      .ring-pulse { animation: rippleRing 2.5s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
      .flow-line { stroke-dasharray: 6, 6; animation: dashFlow 1.8s infinite linear; }
      .floating-badge { animation: floatSlow 4s infinite ease-in-out; }
      .live-dot { animation: statusPulse 1.8s infinite ease-in-out; }
      
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .badge-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#2A3A4E" stroke-width="1.5"/>

  <!-- Subtle Ambient Grid Background -->
  <g opacity="0.07" stroke="#00D4FF" stroke-width="1">
    <line x1="0" y1="64" x2="1000" y2="64"/>
    <line x1="0" y1="128" x2="1000" y2="128"/>
    <line x1="0" y1="192" x2="1000" y2="192"/>
    <line x1="0" y1="256" x2="1000" y2="256"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Left Content: Brand & Identity -->
  <g transform="translate(60, 60)">
    <!-- Top Pill: Autopilot Active -->
    <g transform="translate(0, 0)">
      <rect width="170" height="26" rx="13" fill="#0A1628" stroke="#00FFB3" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#00FFB3" class="live-dot" filter="url(#subtleGlow)"/>
      <text x="26" y="17" fill="#00FFB3" class="badge-text" letter-spacing="0.5">AUTOPILOT ACTIVE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="#FFFFFF" class="brand-title" font-size="42">
      FirstNode <tspan fill="#00D4FF">v2.0</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="104" fill="#00D4FF" class="brand-sub" font-size="16" font-weight="600">
      Digital Identity Journey Tracker
    </text>

    <text x="0" y="132" fill="#8899AA" class="brand-sub" font-size="13">
      Track where your personal data lives online.
    </text>
    <text x="0" y="152" fill="#8899AA" class="brand-sub" font-size="13">
      100% Local-First &bull; 9 Field Categories &bull; Autopilot Interception
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 174)">
      <!-- Badge 1: Timeline -->
      <rect x="0" y="0" width="86" height="24" rx="6" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="14" y="16" fill="#B0C4DE" class="badge-text">Timeline</text>

      <!-- Badge 2: Graph -->
      <rect x="94" y="0" width="118" height="24" rx="6" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="108" y="16" fill="#00D4FF" class="badge-text">Journey Graph</text>

      <!-- Badge 3: Map -->
      <rect x="220" y="0" width="88" height="24" rx="6" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="234" y="16" fill="#00FFB3" class="badge-text">Data Map</text>

      <!-- Badge 4: Analytics -->
      <rect x="316" y="0" width="86" height="24" rx="6" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="330" y="16" fill="#FFD700" class="badge-text">Analytics</text>
    </g>
  </g>

  <!-- Right Visual: Animated Interactive Network Graph -->
  <g transform="translate(620, 20)">
    <!-- Ambient Glow Hub -->
    <circle cx="200" cy="140" r="90" fill="#00D4FF" opacity="0.04" filter="url(#glow)"/>

    <!-- Central Node (FirstNode Identity Core) -->
    <circle cx="200" cy="140" r="22" fill="#0A1628" stroke="#00D4FF" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="200" cy="140" r="12" fill="url(#tealGrad)" class="node-core"/>
    <circle cx="200" cy="140" r="4" fill="#FFFFFF"/>
    <circle cx="200" cy="140" r="16" fill="none" stroke="#00D4FF" stroke-width="1.5" class="ring-pulse"/>

    <!-- Connecting Dynamic Flow Edges -->
    <!-- Center to Top (OAuth: Google) -->
    <line x1="200" y1="140" x2="200" y2="46" stroke="#FFD700" stroke-width="2" class="flow-line" opacity="0.85"/>
    
    <!-- Center to Top-Right (Identity) -->
    <line x1="200" y1="140" x2="300" y2="80" stroke="#00D4FF" stroke-width="2" class="flow-line" opacity="0.85"/>

    <!-- Center to Bottom-Right (Contact) -->
    <line x1="200" y1="140" x2="290" y2="210" stroke="#FF6B6B" stroke-width="2" class="flow-line" opacity="0.85"/>

    <!-- Center to Bottom-Left (Financial) -->
    <line x1="200" y1="140" x2="110" y2="210" stroke="#9B59B6" stroke-width="2" class="flow-line" opacity="0.85"/>

    <!-- Center to Top-Left (Address) -->
    <line x1="200" y1="140" x2="100" y2="80" stroke="#00FFB3" stroke-width="2" class="flow-line" opacity="0.85"/>

    <!-- Outer Nodes -->
    <!-- 1. Top Node: OAuth (Gold) -->
    <g transform="translate(200, 46)" class="floating-badge">
      <circle cx="0" cy="0" r="14" fill="#0A1628" stroke="#FFD700" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#FFD700"/>
      <rect x="-42" y="-30" width="84" height="18" rx="4" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="0" y="-18" fill="#FFD700" class="badge-text" text-anchor="middle" font-size="9.5">OAUTH (GOOGLE)</text>
    </g>

    <!-- 2. Top-Right Node: Identity (Teal) -->
    <g transform="translate(300, 80)">
      <circle cx="0" cy="0" r="13" fill="#0A1628" stroke="#00D4FF" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#00D4FF"/>
      <rect x="18" y="-10" width="60" height="18" rx="4" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="48" y="2" fill="#00D4FF" class="badge-text" text-anchor="middle" font-size="9.5">IDENTITY</text>
    </g>

    <!-- 3. Bottom-Right Node: Contact (Coral) -->
    <g transform="translate(290, 210)">
      <circle cx="0" cy="0" r="14" fill="#0A1628" stroke="#FF6B6B" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#FF6B6B"/>
      <rect x="18" y="-10" width="58" height="18" rx="4" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="47" y="2" fill="#FF6B6B" class="badge-text" text-anchor="middle" font-size="9.5">CONTACT</text>
    </g>

    <!-- 4. Bottom-Left Node: Financial (Purple) -->
    <g transform="translate(110, 210)">
      <circle cx="0" cy="0" r="14" fill="#0A1628" stroke="#9B59B6" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#9B59B6"/>
      <rect x="-76" y="-10" width="62" height="18" rx="4" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="-45" y="2" fill="#9B59B6" class="badge-text" text-anchor="middle" font-size="9.5">FINANCIAL</text>
    </g>

    <!-- 5. Top-Left Node: Address (Mint) -->
    <g transform="translate(100, 80)">
      <circle cx="0" cy="0" r="13" fill="#0A1628" stroke="#00FFB3" stroke-width="2" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="5" fill="#00FFB3"/>
      <rect x="-70" y="-10" width="58" height="18" rx="4" fill="#1E2A3A" stroke="#2A3A4E"/>
      <text x="-41" y="2" fill="#00FFB3" class="badge-text" text-anchor="middle" font-size="9.5">ADDRESS</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="50" y="318" width="900" height="2" fill="url(#accentLineGrad)"/>
</svg>
