<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1E2A3A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099CC"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB3"/>
      <stop offset="100%" stop-color="#00CC8E"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E04848"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#2A3A4E" stroke-width="1.5"/>

  <!-- Network Connection Lines -->
  <g stroke-linecap="round" opacity="0.85">
    <!-- Center to Top Right (Mint - Name) -->
    <line x1="64" y1="64" x2="94" y2="34" stroke="#00FFB3" stroke-width="2.5" stroke-dasharray="3,3"/>
    <!-- Center to Bottom Right (Coral - Email) -->
    <line x1="64" y1="64" x2="96" y2="92" stroke="#FF6B6B" stroke-width="2.5"/>
    <!-- Center to Bottom Left (Gold - Phone) -->
    <line x1="64" y1="64" x2="34" y2="92" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="2,2"/>
    <!-- Center to Top Left (Purple - Address) -->
    <line x1="64" y1="64" x2="32" y2="38" stroke="#9B59B6" stroke-width="2.5"/>
    <!-- Center to Top (Teal - OAuth) -->
    <line x1="64" y1="64" x2="64" y2="24" stroke="#00D4FF" stroke-width="2.5"/>
  </g>

  <!-- Outer Orbit Nodes -->
  <!-- Top Node (OAuth) -->
  <circle cx="64" cy="24" r="8" fill="#0A1628" stroke="#00D4FF" stroke-width="2.5"/>
  <circle cx="64" cy="24" r="4" fill="#00D4FF"/>

  <!-- Top-Right Node (Mint) -->
  <circle cx="94" cy="34" r="7" fill="#0A1628" stroke="#00FFB3" stroke-width="2.5"/>
  <circle cx="94" cy="34" r="3.5" fill="#00FFB3"/>

  <!-- Bottom-Right Node (Coral) -->
  <circle cx="96" cy="92" r="8.5" fill="#0A1628" stroke="#FF6B6B" stroke-width="2.5"/>
  <circle cx="96" cy="92" r="4.5" fill="#FF6B6B"/>

  <!-- Bottom-Left Node (Gold) -->
  <circle cx="34" cy="92" r="7.5" fill="#0A1628" stroke="#FFD700" stroke-width="2.5"/>
  <circle cx="34" cy="92" r="3.5" fill="#FFD700"/>

  <!-- Top-Left Node (Purple) -->
  <circle cx="32" cy="38" r="7" fill="#0A1628" stroke="#9B59B6" stroke-width="2.5"/>
  <circle cx="32" cy="38" r="3" fill="#9B59B6"/>

  <!-- Central "FirstNode" Hub -->
  <circle cx="64" cy="64" r="19" fill="#0A1628" stroke="#00D4FF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="12" fill="url(#tealGrad)"/>
  <circle cx="64" cy="64" r="6" fill="#FFFFFF"/>

  <!-- Lock / Shield Symbol inside center -->
  <path d="M60 62.5 C60 60.5 61.5 59 64 59 C66.5 59 68 60.5 68 62.5 L68 64.5 L60 64.5 Z" fill="none" stroke="#0A1628" stroke-width="1.2"/>
</svg>
